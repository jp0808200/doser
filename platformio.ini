; Acid-Dosing Unit Firmware (ESP32-C3 Super Mini)
; Specification: acid-dosing-fw-specification.md

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -std=gnu++17 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
; The ESP32 Arduino framework script forces -std=gnu++11 after build_flags;
; strip it so the C++17 standard required by the specification is effective.
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    ; Step 8: async web server (existing public libraries, spec 3.11);
    ; the AsyncTCP transport provides the socket servicing library context
    ; (specification 2.2 / 5.1 Step 8) - no application tasks are created.
    me-no-dev/ESPAsyncWebServer
    ; (AsyncTCP is auto-resolved as a dependency of ESPAsyncWebServer for
    ;  espressif32: ESP32Async/AsyncTCP)
    ; Step 9: optional MQTT uses the platform's built-in esp-mqtt client
    ;  (mqtt_client.h, part of the official espressif32 platform - no extra
    ;  lib_dep). The knolleary/PubSubClient in this stack has no QoS
    ;  argument on publish and always sends QoS 0, which would violate the
    ;  spec 3.12 constraint "QoS must be 1". See mqtt_reporter.h for detail.

; Production build: test injection compiled out.
[env:acid-doser]

; HIL build: serial test-injection enabled (specification 5.2), e.g. 'flowinject 1000'.
[env:acid-doser-test]
build_flags = ${env.build_flags} -DENABLE_TEST_INJECTION
